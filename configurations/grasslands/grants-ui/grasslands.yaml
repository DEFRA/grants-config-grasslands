engine: V2
name: Apply for a Grasslands agreement
metadata:
  id: b8954431-a126-49a5-932d-0fd212feb1d4
  surveyLabel: Grasslands
  enabledInProd: true
  enabledLandActions:
    - 'CLIG3'
    - 'CSAM3'
    - 'SCR2'
    - 'HEF1'
    - 'WBD1'
  singleParcelSubmission: false
  referenceNumberPrefix: GLD
  supportEmail: ruralpayments@defra.gov.uk
  grantRedirectRules:
    preSubmission:
      - toPath: /tasks
    excludedPaths: ['print-submitted-application']
  permissions:
    enforce: true
    resource: csApplications
    pageAccess:
      default: amend
      rules:
        - paths:
            - declaration
          permission: submit
        - paths:
            - print-submitted-application
            - confirmation
          permission: view
  detailsPage:
    confirmationFieldName: businessDetailsUpToDate
    toleratedFailurePaths:
      - vat
      - countyParishHoldings
    query:
      name: Business
      entities:
        - name: customer
          variableName: crn
          variableSource: credentials.crn
          fields:
            - path: info
              fields:
                - path: name
                  fields:
                    - path: title
                    - path: first
                    - path: middle
                    - path: last
                - path: email
                  fields:
                    - path: address
                - path: phone
                  fields:
                    - path: mobile
                    - path: landline
                - path: address
                  fields:
                    - path: line1
                    - path: line2
                    - path: line3
                    - path: line4
                    - path: line5
                    - path: street
                    - path: city
                    - path: postalCode
                    - path: uprn
                    - path: county
                    - path: buildingName
                    - path: buildingNumberRange
                    - path: dependentLocality
                    - path: doubleDependentLocality
                    - path: flatName
                    - path: pafOrganisationName
        - name: business
          variableName: sbi
          variableSource: credentials.sbi
          fields:
            - path: info
              fields:
                - path: reference
                - path: email
                  fields:
                    - path: address
                - path: phone
                  fields:
                    - path: mobile
                    - path: landline
                - path: name
                - path: address
                  fields:
                    - path: line1
                    - path: line2
                    - path: line3
                    - path: line4
                    - path: line5
                    - path: street
                    - path: city
                    - path: postalCode
                    - path: uprn
                    - path: county
                    - path: buildingName
                    - path: buildingNumberRange
                    - path: dependentLocality
                    - path: doubleDependentLocality
                    - path: flatName
                    - path: pafOrganisationName
                - path: vat
    responseMapping:
      business: data.business.info
      customer: data.customer.info
    displaySections:
      - title: Business contact details
        fields:
          - label: Business name
            sourcePath: business.name
          - label: Business address
            sourcePath: business.address
            format: address
          - label: Business phone numbers
            sourcePath: business.phone
            format: phoneNumbers
          - label: Business email address
            sourcePath: business.email.address
      - title: Reference numbers
        fields:
          - label: Single Business Identifier (SBI)
            sourceType: credentials
            sourcePath: sbi
          - label: VAT registration number
            sourcePath: business.vat
      - title: Personal details
        fields:
          - label: Full name
            sourcePath: customer.name
            format: fullName
          - label: Customer reference number
            sourceType: credentials
            sourcePath: crn
          - label: Personal address
            sourcePath: customer.address
            format: address
          - label: Personal phone numbers
            sourcePath: customer.phone
            format: phoneNumbers
          - label: Personal email address
            sourcePath: customer.email.address
  printPage:
    showApplicantDetails: true
    includeApplicationInTitle: false
  incorrectDetailsContent:
    heading: Update your business details
    paragraphs:
      - You need to update your business details before you can continue with this application.
      - textBefore: 'To update your details follow our '
        link:
          text: Register and update your details with the Rural Payments Agency guidance
          href: https://www.gov.uk/guidance/update-personal-and-business-details-in-the-rural-payments-service#what-personal-details-you-can-update
        textAfter: '.'
    showRpaSupport: false
  tasklist:
    showCompletionStatus: false
    statuses:
      cannotStart:
        text: 'Cannot start yet'
      notStarted:
        text: 'Incomplete'
        classes: 'govuk-tag--blue'
      completed:
        text: 'Completed'
  options:
    submitButtonText: Save and continue

# Tasks for the task list
sections:
  - name: check
    title: Check before you start
    id: bb8b763d-38d2-4a70-8e02-80c53c3d95c9
  - name: select
    title: Select land and actions
    id: 28ad9fe7-5b31-4bc2-8a17-57593879ed39
  - name: submit
    title: Review and submit your application
    id: ade97a6e-1852-4f15-9624-1613c6dcc69b

pages:
  # Task list page
  - title: Apply for a Grasslands agreement
    id: 024e726c-8712-4d8b-bed8-88a5669bab83
    path: /tasks
    controller: TaskListPageController
    config:
      width: full

  # Check before you start ---------------------------------------------------------------------------------------------
  - title: Check your details
    id: f0e1ed57-fd77-42f3-b7fd-662854210777
    path: /check-details
    section: bb8b763d-38d2-4a70-8e02-80c53c3d95c9
    controller: CheckDetailsController
    config:
      width: full

  - title: Check your digital maps are correct
    id: 08ff02d3-c77e-45ff-8cee-5e2e5ccea7a4
    path: /check-your-land-details
    section: bb8b763d-38d2-4a70-8e02-80c53c3d95c9
    controller: TaskPageController
    components:
      - name: checkYourLandDetailsGuidance
        id: 91855c8b-b774-4a53-84ec-f02486a933b4
        type: Html
        content: |
          <p class="govuk-body">
            Before you continue, check that the land details on your digital maps are up to date. If they are not, you may not be able to apply for the Grasslands actions you select. Read the guidance on <a class="govuk-link" href="https://www.gov.uk/guidance/digital-maps-in-the-rural-payments-service-check-and-change-mapping-updates" target="_blank" rel="noopener noreferrer">how to check your digital maps (opens in new tab)</a>.
          </p>

          <p class="govuk-body">Check that your digital maps show:</p>
          <ul class="govuk-list govuk-list--bullet">
          <li>all the land parcels you want to include in this application</li>
          <li>the correct total area (in hectares) for each land parcel</li>
          <li>the correct land covers for each land parcel (for example, arable land, permanent grassland, permanent crops or relevant non-agricultural land cover)</li>
          </ul>

          <p class="govuk-body">
          <a class="govuk-link" href="https://www.gov.uk/guidance/digital-maps-in-the-rural-payments-service-check-and-change-mapping-updates" target="_blank" rel="noopener noreferrer">Check your digital maps (opens in new tab)</a>
          </p>
      - name: confirmLandDetailsUpToDate
        id: 055fe807-11da-48a3-9c49-e1b64f7938e2
        type: YesNoField
        title: Do your digital maps show the correct land details?
        shortDescription: Confirm your land details are up to date
        options:
          required: true
          classes: govuk-radios
          customValidationMessages:
            any.required: Select if your digital maps show the correct land details

  - title: Update your land details
    id: eac881f6-c9e6-4f49-b320-9bd86a240c0b
    path: /update-your-land-details
    section: bb8b763d-38d2-4a70-8e02-80c53c3d95c9
    controller: TerminalPageController
    components:
      - name: updateYourLandDetailsGuidance
        id: e6c9786b-1e28-4bfc-8c09-e1c6e8b4ac1a
        title: Html
        type: Html
        content: |
          <p class="govuk-body">
            As your digital maps are not up to date, <a class="govuk-link" href="https://www.gov.uk/guidance/request-rural-land-changes" target="_blank" rel="noopener noreferrer">request rural land changes</a> or <a class="govuk-link" href="https://www.gov.uk/government/publications/rural-land-register-map-and-land-cover-form-rle1" target="_blank" rel="noopener noreferrer">submit an RLE1 form</a> to ask us to update them.
          </p>

          <p class="govuk-body">
            Submit your mapping update request as soon as possible. Your information will take at least 48 hours to update and could take longer.
          </p>
    condition: d98a42b2-5cc4-4ad7-9568-869461fe7739

  - title: Confirm you have management control of all the land in your application
    id: 653df07b-4208-4505-b5c7-7a8c65a3f01a
    path: /management-control-of-land
    section: bb8b763d-38d2-4a70-8e02-80c53c3d95c9
    controller: TaskPageController
    components:
      - name: managementControlGuidance
        id: 970beabd-24f5-4c28-913d-e2f8305f7bd4
        type: Html
        content: |
          <p class="govuk-body">
          You must have management control of all the land in your application for as long as you are carrying out the actions on the land.
          </p>

          <p class="govuk-body">
          If you have a short-term tenancy, only include land if you expect to have management control of it for the whole of that tenancy.
          </p>

          <p class="govuk-body">
          Read the guidance on <a class="govuk-link" href="https://www.gov.uk/government/publications/sustainable-farming-incentive-2026-sfi26/sfi26-scheme-rules-and-guidance#check-youll-have-management-control-of-the-land" target="_blank" rel="noopener noreferrer">management control of land (opens in a new tab)</a>.
          </p>
      - name: managementControl
        id: b00eb6d7-8e45-45d1-94d1-7fa085a179f5
        type: YesNoField
        title: Do you have management control of all the land?
        shortDescription: Confirm management control of the land
        options:
          required: true
          classes: govuk-radios
          customValidationMessages:
            any.required: Confirm if you have management control of the land in this application

  - title: You are not eligible to apply
    id: 083a5236-182d-4ddb-b90e-2c3567d17cd5
    path: /not-eligible
    section: bb8b763d-38d2-4a70-8e02-80c53c3d95c9
    controller: TerminalPageController
    components:
      - name: notEligibleInfo
        id: 29536870-41de-47d0-ab24-bf3365c6bba5
        title: Html
        type: Html
        content: |
          <p class="govuk-body">You must have management control of the land you want to include in your application. If you want to change your answer, go back to management control of land.</p>
    condition: d7dab0a1-c91e-4212-b1e0-d86bc9d5151d

  # Select land and actions --------------------------------------------------------------------------------------------
  - title: Select your land parcels
    id: a1b2c3d4-0001-0001-0001-000000000003
    path: /select-land-parcel
    section: 28ad9fe7-5b31-4bc2-8a17-57593879ed39
    controller: MapSelectPageController
    components:
      - name: selectedParcelsDisplay
        id: a1b2c3d4-0001-0001-0001-000000000010
        type: HiddenField
        title: Land parcel
        shortDescription: Select the land and the actions you want to apply for
        options:
          required: false

  - title: Select actions for land parcel
    id: a1b2c3d4-0001-0001-0001-000000000004
    path: /select-actions-for-land-parcel
    section: 28ad9fe7-5b31-4bc2-8a17-57593879ed39
    controller: SelectActionsPageController

  - title: Review land parcels and actions
    id: 4c6ef03f-b413-4a2b-9736-7f4df3afad33
    path: /confirm-land-and-actions
    controller: ConfirmLandAndActionsPageController
    config:
      redirects:
        addAnotherLandParcel: /select-land-parcel

  - title: You must have consent
    path: /you-must-have-consent
    section: 28ad9fe7-5b31-4bc2-8a17-57593879ed39
    controller: ConsentPageController
    id: d11421c1-193c-4c22-ba46-54a6696ff6ce

  # Review and submit your application ---------------------------------------------------------------------------------
  - title: Check your answers
    id: 7a872360-6b89-4013-a9fa-dbedca9d3a4d
    path: /summary
    section: ade97a6e-1852-4f15-9624-1613c6dcc69b
    controller: CheckResponsesPageController
    config:
      width: full

  - title: Submit your application
    id: 18514e4f-8615-4585-81ae-6e74e5d45def
    path: /declaration
    section: ade97a6e-1852-4f15-9624-1613c6dcc69b
    controller: DeclarationPageController
    config:
      submitButtonText: I agree - submit my application
      showSupportDetails: false
    components:
      - name: declarationContent
        id: 695fdab7-f102-4c51-882c-f2d0082dab61
        type: Html
        content: |
          <p class="govuk-body">By submitting your application, you confirm that:</p>
          <ul class="govuk-list govuk-list--bullet">
          <li>the information in your application is correct</li>
          {% if 'sssi' in pageConsents %}
          <li>you will get consent for actions involving sites of special scientific interest (SSSI)</li>
          {% endif %}
          {% if 'hefer' in pageConsents %}
          <li>you will request a Historic Environment Farm Environment Record (HEFER) if required</li>
          {% endif %}
          <li>you have management control of the land for the required period</li>
          <li>you will meet the requirements for the Grasslands actions you have applied for</li>
          </ul>
          <p class="govuk-body">It’s your responsibility to check that land (including landscape features) is eligible for your Grasslands actions. Payments may be reduced if the RPA finds ineligible land, features or incompatible actions.</p>
          <p class="govuk-body">If you’ve applied for Grasslands actions on land that has a conditional exemption from Inheritance Tax, you will not be paid for activities which duplicate, or conflict with, your undertakings under that exemption.</p>
          <p class="govuk-body">If you’ve applied for Grasslands actions on land owned by a public body, you will not be paid for activities which conflict with, or duplicate, the public body’s statutory duties.</p>
          <p class="govuk-body">You must make sure that you have management control of the land for the duration of the actions.</p>

  # Post submission pages ----------------------------------------------------------------------------------------------
  - title: Confirmation
    id: f8b1e6c1-1d5c-4be9-9b4d-0ddef7e28a16
    path: /confirmation
    controller: ConfirmationPageController
    config:
      panelTitle: 'Application complete'
      panelText: 'Your application number'
    components:
      - name: confirmationContent
        id: 15e1efbe-5d88-4fa2-8b0e-eb4ece234c59
        type: Html
        content: |
          <h2 class="govuk-heading-m">What happens next</h2>
          <p class="govuk-body">Thank you for submitting your Grasslands application.</p>
          <p class="govuk-body">We’ll email you when your agreement offer is ready for you to check in the Farm and Land Service.</p>
          <p class="govuk-body"><a class="govuk-link" href="/{{SLUG}}/print-submitted-application" target="_blank">View and print submitted application (opens in new tab)</a></p>
          <p class="govuk-body"><a href="https://fcp-sfd-frontend.{{cdpEnvironment}}.cdp-int.defra.cloud/" class="govuk-button">Back to Farm and Land Service</a></p>

  - title: PrintSubmittedApplication
    id: 074a99e3-4542-4bea-aaa4-e9b770dda806
    path: /print-submitted-application
    controller: PrintSubmittedApplicationController
    config:
      width: full

  - title: Remove land parcel
    id: ebb2c2b3-b335-446a-a490-6f0d81dd5aea
    path: /remove-parcel
    controller: RemoveActionPageController
    config:
      returnPath: /confirm-land-and-actions

  - title: Remove action
    id: d02245bc-3c05-4b90-8af1-7cef322cbabf
    path: /remove-action
    controller: RemoveActionPageController
    config:
      returnPath: /confirm-land-and-actions

lists: []

conditions:
  - id: d7dab0a1-c91e-4212-b1e0-d86bc9d5151d
    displayName: managementControlNo
    items:
      - id: 8cde5f16-16c2-4be4-9a0d-54b20f3b288b
        componentId: b00eb6d7-8e45-45d1-94d1-7fa085a179f5
        operator: is
        type: BooleanValue
        value: false
  - id: d98a42b2-5cc4-4ad7-9568-869461fe7739
    displayName: checkLandDetailsNo
    items:
      - id: 835eddbd-3ab6-4732-86e1-2193e965dd9b
        componentId: 055fe807-11da-48a3-9c49-e1b64f7938e2
        operator: is
        type: BooleanValue
        value: false

schema: 2
